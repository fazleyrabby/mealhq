services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealhq_app
    restart: unless-stopped
    # Fix storage/bootstrap ownership at startup so php-fpm (www-data) can write
    # logs/cache/sessions. storage is a bind mount, so the image's chmod is not enough.
    command: sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache && ln -sf /var/www/html/storage/app/public /var/www/html/public/storage && exec /usr/bin/supervisord -c /etc/supervisor/conf.d/supervisord.conf"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mealhq.rule=Host(`mealhq.fazleyrabbi.xyz`)"
      - "traefik.http.routers.mealhq.entrypoints=web"
      - "traefik.http.services.mealhq.loadbalancer.server.port=80"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    networks:
      - traefik
      - mealhq
      - mysql-shared

volumes: {}

networks:
  traefik:
    external: true
  mealhq:
    driver: bridge
  mysql-shared:
    external: true
