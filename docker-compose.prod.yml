services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mealhq_app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    env_file:
      - .env
    volumes:
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - mealhq

  mysql:
    image: mysql:8.0
    container_name: mealhq_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mealhq}
      MYSQL_USER: ${DB_USERNAME:-mealhq}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mealhq

volumes:
  mysql_data:

networks:
  mealhq:
    driver: bridge
